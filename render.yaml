services:

  - type: web
    name: raja-server
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 120

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6


  - type: worker
    name: raja-worker
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: python worker.py

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
