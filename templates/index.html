<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💀 Insta Bulk Sender - 24/7</title>
    <style>
        :root { 
            --bg: #050505; 
            --card: rgba(15, 15, 20, 0.85); 
            --border: rgba(255, 255, 255, 0.1); 
            --text: #e0e0e0; 
            --neon-pink: #ff007f; 
            --neon-blue: #00f3ff; 
            --neon-purple: #9d00ff;
            --neon-yellow: #ffea00;
            --green: #00ff66; 
            --red: #ff3333; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        
        body { 
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1a0033 0%, #050505 70%);
            color: var(--text); 
            display: flex; justify-content: center; padding: 20px; min-height: 100vh; 
        }

        .container { 
            background: var(--card); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid var(--border); 
            border-radius: 20px; 
            padding: 30px; 
            width: 100%; 
            max-width: 800px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8), 0 0 30px rgba(157, 0, 255, 0.2); 
        }
        
        /* --- HEADER & PHOTO --- */
        .header-area { text-align: center; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center;}
        .header-area img { 
            width: 130px; height: 130px; object-fit: cover; border-radius: 50%; margin-bottom: 15px; 
            border: 3px solid var(--neon-pink); 
            box-shadow: 0 0 25px var(--neon-pink), inset 0 0 10px var(--neon-pink); 
            transition: 0.5s;
        }
        .header-area img:hover { transform: scale(1.05) rotate(5deg); border-color: var(--neon-blue); box-shadow: 0 0 30px var(--neon-blue); }
        
        .header-area p { 
            color: #fff; font-weight: bold; font-size: 1.4em; letter-spacing: 4px; text-transform: uppercase; 
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
        }
        
        /* --- FORM GRID --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }
        
        /* Multi-colored Labels */
        label.c-pink { color: var(--neon-pink); text-shadow: 0 0 5px rgba(255,0,127,0.5); }
        label.c-blue { color: var(--neon-blue); text-shadow: 0 0 5px rgba(0,243,255,0.5); }
        label.c-purple { color: var(--neon-purple); text-shadow: 0 0 5px rgba(157,0,255,0.5); }
        label.c-yellow { color: var(--neon-yellow); text-shadow: 0 0 5px rgba(255,234,0,0.5); }
        
        label { display: block; margin-bottom: 8px; font-size: 0.95em; font-weight: bold; letter-spacing: 1px;}
        
        textarea, input[type="text"], input[type="number"], select { 
            width: 100%; padding: 14px; background: rgba(0,0,0,0.7); border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 14px; transition: 0.3s; 
        }
        textarea:focus, input[type="text"]:focus, input[type="number"]:focus, select:focus { 
            outline: none; border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); 
        }
        
        .file-upload-btn { 
            background: rgba(157, 0, 255, 0.2); color: var(--neon-purple); border: 1px dashed var(--neon-purple); 
            padding: 10px 15px; border-radius: 6px; cursor: pointer; display: inline-block; font-weight: bold; transition: 0.3s;
        }
        .file-upload-btn:hover { background: rgba(157, 0, 255, 0.4); box-shadow: 0 0 15px rgba(157, 0, 255, 0.6); }

        /* --- BUTTONS --- */
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        button { flex: 1; padding: 16px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; }
        
        #startBtn { 
            background: linear-gradient(45deg, #00cc66, #00ffcc); color: #000; 
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4); 
        }
        #startBtn:hover:not(:disabled) { background: linear-gradient(45deg, #00ffaa, #00ff66); box-shadow: 0 0 25px rgba(0, 255, 102, 0.8); transform: translateY(-2px); }
        
        #stopBtn { 
            background: linear-gradient(45deg, #ff0033, #ff007f); color: #fff; 
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); 
        }
        #stopBtn:hover:not(:disabled) { background: linear-gradient(45deg, #ff3355, #ff00aa); box-shadow: 0 0 25px rgba(255, 0, 127, 0.8); transform: translateY(-2px); }
        
        button:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; transform: none; }
        
        /* --- TERMINAL --- */
        .terminal { 
            margin-top: 25px; background: #000; border: 1px solid #333; border-radius: 10px; padding: 15px; height: 250px; overflow-y: auto; font-size: 13px; 
            border-left: 4px solid var(--neon-blue); box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 10px rgba(0, 243, 255, 0.1);
        }
        .log-success { color: var(--green); text-shadow: 0 0 5px rgba(0,255,102,0.3); }
        .log-error { color: var(--red); text-shadow: 0 0 5px rgba(255,51,51,0.3); }
        .log-info { color: var(--neon-blue); }
        .log-warning { color: var(--neon-yellow); }
        .log-typing { color: var(--neon-purple); font-style: italic; }
        
        /* --- STATUS BAR --- */
        .status-bar { display: flex; justify-content: space-between; margin-top: 20px; padding: 15px 20px; background: rgba(0,0,0,0.8); border-radius: 10px; border: 1px solid var(--border); }
        .status-bar span { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-area">
            <img src="https://i.ibb.co/KjtjBDRP/file-00000000f49c821197fdc7fcda40847d.png" alt="Icon" onerror="this.src='https://via.placeholder.com/130/ff007f/000000?text=Insta'">
            <p>Insta 24/7 Sender</p>
        </div>

        <form id="senderForm">
            <div class="grid">
                <div class="full-width">
                    <label class="c-pink">🍪 Instagram Cookies (Paste karein ya File Upload karein)</label>
                    <div>
                        <label for="cookie_file" class="file-upload-btn">📁 Upload Cookies File (.txt)</label>
                        <input type="file" id="cookie_file" accept=".txt" onchange="loadCookieFile(event)" style="display: none;">
                    </div>
                    <textarea id="cookies" name="cookies" rows="4" placeholder="sessionid=...; ds_user_id=...; csrftoken=..." required></textarea>
                </div>

                <div class="full-width">
                    <label class="c-blue">⚙️ Execution Mode (Kaise chalana hai?)</label>
                    <select id="run_mode" name="run_mode" required>
                        <option value="parallel">Ek Sath (Parallel) - Fast</option>
                        <option value="sequential">Ek Ke Baad Ek (Sequential) - Safe</option>
                    </select>
                </div>
                
                <div>
                    <label class="c-purple">👥 Thread ID (Group ya Chat)</label>
                    <input type="text" id="thread_id" name="thread_id" placeholder="e.g. 1784737695..." required>
                </div>

                <div>
                    <label class="c-yellow">⏱️ Time Delay (Seconds)</label>
                    <input type="number" id="time_delay" name="time_delay" value="30" min="10" required>
                </div>

                <div class="full-width">
                    <label class="c-pink">🏷️ Here Name (Message ke sath jayega)</label>
                    <input type="text" id="sender_name" name="sender_name" placeholder="e.g. I am here:">
                </div>

                <div class="full-width">
                    <label class="c-blue">📁 Upload Message File (.txt)</label>
                    <input type="file" id="message_file" name="message_file" accept=".txt" required style="border: 1px solid #444; padding: 10px; border-radius: 8px;">
                </div>
            </div>

            <div class="btn-group">
                <button type="button" id="startBtn">▶️ Start 24/7</button>
                <button type="button" id="stopBtn" disabled>⏹️ Stop Server</button>
            </div>
        </form>

        <div class="status-bar">
            <div>Status: <span id="statusText" style="color:var(--neon-pink)">IDLE</span></div>
            <div>Sent: <span id="sentCount" style="color:var(--green)">0</span> | Failed: <span id="failCount" style="color:var(--red)">0</span></div>
        </div>

        <div class="terminal" id="terminal">
            <div class="log-info">> System ready. Waiting for input...</div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const terminal = document.getElementById('terminal');
        const statusText = document.getElementById('statusText');
        const form = document.getElementById('senderForm');
        let pollingInterval = null;

        function loadCookieFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { document.getElementById('cookies').value = e.target.result; };
            reader.readAsText(file);
        }

        function printLog(msg) {
            const div = document.createElement('div');
            // Color coding based on emojis in backend logs
            if (msg.includes('❌') || msg.includes('⚠️') || msg.includes('Blocked')) {
                div.className = 'log-error';
            } else if (msg.includes('✅') || msg.includes('🎉')) {
                div.className = 'log-success';
            } else if (msg.includes('⌨️') || msg.includes('Typing')) {
                div.className = 'log-typing';
            } else if (msg.includes('🛑') || msg.includes('🚨')) {
                div.className = 'log-warning';
            } else {
                div.className = 'log-info';
            }
            div.innerText = msg;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                if (!res.ok) return;
                const data = await res.json();
                
                statusText.innerText = data.isRunning ? 'RUNNING' : 'IDLE';
                statusText.style.color = data.isRunning ? 'var(--green)' : 'var(--neon-pink)';
                document.getElementById('sentCount').innerText = data.totalSent || 0;
                document.getElementById('failCount').innerText = data.totalFailed || 0;

                if (data.logs && data.logs.length > 0) {
                    terminal.innerHTML = ''; 
                    data.logs.forEach(log => printLog(log));
                }
                startBtn.disabled = data.isRunning;
                stopBtn.disabled = !data.isRunning;
            } catch (err) {}
        }

        startBtn.addEventListener('click', async () => {
            if (!form.checkValidity()) { form.reportValidity(); return; }
            const formData = new FormData(form);
            terminal.innerHTML = '<div class="log-info">> 🚀 Starting server...</div>';
            startBtn.disabled = true;

            try {
                const res = await fetch('/api/start', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (data.status === 'error') {
                    printLog(`❌ Error: ${data.message}`);
                    startBtn.disabled = false;
                    return;
                }
                
                printLog(`✅ ${data.message}`);
                if (!pollingInterval) pollingInterval = setInterval(checkStatus, 2000);
                checkStatus();
            } catch (err) {
                printLog(`❌ Network Error: ${err.message}`);
                startBtn.disabled = false;
            }
        });

        stopBtn.addEventListener('click', async () => {
            stopBtn.disabled = true;
            printLog("🛑 Stopping execution safely...");
            try { await fetch('/api/stop', { method: 'POST' }); } catch (e) {}
        });

        window.onload = () => {
            checkStatus();
            pollingInterval = setInterval(checkStatus, 3000);
        };
    </script>
</body>
</html>
