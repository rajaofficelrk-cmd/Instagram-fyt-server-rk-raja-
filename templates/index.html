<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Raja Server</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

.container {
    width: 94%;
    max-width: 700px;
    margin: 20px auto;
}

.header {
    text-align: center;
    padding: 20px 10px;
    border: 1px solid #333;
    border-radius: 16px;
    margin-bottom: 15px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.online {
    margin-top: 10px;
    color: #00ff88;
    font-weight: bold;
}

.card {
    background: #0d0d0d;
    border: 1px solid #292929;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    margin-bottom: 14px;
    background: #050505;
    color: white;
    border: 1px solid #444;
    border-radius: 10px;
    outline: none;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

input[type="file"] {
    padding: 10px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

button {
    padding: 12px 5px;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

.start {
    background: #00c853;
    color: white;
}

.pause {
    background: #ff9800;
    color: white;
}

.stop {
    background: #f44336;
    color: white;
}

.clear {
    background: #555;
    color: white;
}

.upload-info {
    font-size: 13px;
    color: #aaa;
    margin-top: -5px;
    margin-bottom: 10px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.stat {
    text-align: center;
    padding: 12px 5px;
    background: #151515;
    border-radius: 10px;
}

.stat-number {
    font-size: 22px;
    font-weight: bold;
}

.stat-title {
    font-size: 12px;
    color: #aaa;
}

.progress-bg {
    width: 100%;
    height: 18px;
    background: #222;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 10px;
}

.progress {
    height: 100%;
    width: 0%;
    background: #00c853;
    transition: width .3s;
}

.info {
    line-height: 1.8;
    font-size: 14px;
}

.value {
    color: #00ff88;
}

#message {
    color: #ffcc00;
}

@media(max-width: 500px) {

    .buttons {
        grid-template-columns: repeat(2, 1fr);
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            ◄⸻̅͟ˣ͠𓆩𝐑꯭꘍꯭֟፝͡᪂꘍꯭ 𝐋꯭𖾝ԍ𖾝꯭֟፝͡᎔꯭𑀘𓆪꯭ˣ͢
        </div>

        <div class="online">
            🟢 SERVER ONLINE
        </div>

    </div>


    <div class="card">

        <label>Sender ID / Account ID</label>

        <input
            type="text"
            id="senderId"
            placeholder="Sender ID"
        >


        <label>Recipient UID</label>

        <input
            type="text"
            id="recipientUid"
            placeholder="Recipient UID"
        >


        <label>Message</label>

        <textarea
            id="messageInput"
            placeholder="Message yahan likho..."
        ></textarea>


        <label>📄 Message File — TXT / CSV</label>

        <input
            type="file"
            id="messageFile"
            accept=".txt,.csv"
        >

        <div class="upload-info">
            TXT: har line ek message
            <br>
            CSV: recipient_uid,message
        </div>


        <div class="buttons">

            <button
                class="start"
                onclick="startJob()"
            >
                ▶ START
            </button>

            <button
                class="pause"
                onclick="pauseJob()"
            >
                ⏸ PAUSE
            </button>

            <button
                class="stop"
                onclick="stopJob()"
            >
                ⏹ STOP
            </button>

            <button
                class="clear"
                onclick="clearJob()"
            >
                🗑 CLEAR
            </button>

        </div>

    </div>


    <div class="card">

        <div class="stats">

            <div class="stat">
                <div
                    class="stat-number"
                    id="total"
                >0</div>

                <div class="stat-title">
                    TOTAL
                </div>
            </div>


            <div class="stat">
                <div
                    class="stat-number"
                    id="processed"
                >0</div>

                <div class="stat-title">
                    PROCESSED
                </div>
            </div>


            <div class="stat">
                <div
                    class="stat-number"
                    id="success"
                >0</div>

                <div class="stat-title">
                    SUCCESS
                </div>
            </div>


            <div class="stat">
                <div
                    class="stat-number"
                    id="failed"
                >0</div>

                <div class="stat-title">
                    FAILED
                </div>
            </div>

        </div>


        <div class="progress-bg">

            <div
                class="progress"
                id="progress"
            ></div>

        </div>

    </div>


    <div class="card info">

        <div>
            Status:
            <span
                class="value"
                id="status"
            >idle</span>
        </div>

        <div>
            Job ID:
            <span
                class="value"
                id="jobId"
            >-</span>
        </div>

        <div>
            Sender:
            <span
                class="value"
                id="senderView"
            >-</span>
        </div>

        <div>
            Recipient:
            <span
                class="value"
                id="recipientView"
            >-</span>
        </div>

        <div>
            Message File:
            <span
                class="value"
                id="fileView"
            >-</span>
        </div>

        <div>
            Last Update:
            <span
                class="value"
                id="updated"
            >-</span>
        </div>

        <div>
            Message:
            <span id="message">
                -
            </span>
        </div>

    </div>

</div>


<script>

async function postData(url, data = null) {

    const options = {
        method: "POST"
    };

    if (data) {
        options.body = data;
    }

    const response = await fetch(
        url,
        options
    );

    return await response.json();
}


async function createJob() {

    const formData = new FormData();

    formData.append(
        "sender_id",
        document.getElementById(
            "senderId"
        ).value
    );

    formData.append(
        "recipient_uid",
        document.getElementById(
            "recipientUid"
        ).value
    );

    formData.append(
        "message",
        document.getElementById(
            "messageInput"
        ).value
    );

    const file =
        document.getElementById(
            "messageFile"
        ).files[0];

    if (file) {

        formData.append(
            "message_file",
            file
        );

    }

    return await postData(
        "/add",
        formData
    );
}


async function startJob() {

    const status =
        await fetch("/api/status")
            .then(r => r.json());

    if (!status.items ||
        status.items.length === 0) {

        const result =
            await createJob();

        if (!result.ok) {

            alert(
                result.error ||
                "Job create nahi hua"
            );

            return;
        }
    }

    const result =
        await postData("/start");

    if (!result.ok) {

        alert(
            result.error ||
            "Start failed"
        );
    }

    loadStatus();
}


async function pauseJob() {

    await postData("/pause");

    loadStatus();
}


async function stopJob() {

    await postData("/stop");

    loadStatus();
}


async function clearJob() {

    if (!confirm(
        "Current job clear karna hai?"
    )) {
        return;
    }

    await postData("/clear");

    document.getElementById(
        "senderId"
    ).value = "";

    document.getElementById(
        "recipientUid"
    ).value = "";

    document.getElementById(
        "messageInput"
    ).value = "";

    document.getElementById(
        "messageFile"
    ).value = "";

    loadStatus();
}


async function loadStatus() {

    try {

        const response =
            await fetch(
                "/api/status"
            );

        const data =
            await response.json();


        document.getElementById(
            "total"
        ).innerText =
            data.total || 0;


        document.getElementById(
            "processed"
        ).innerText =
            data.processed || 0;


        document.getElementById(
            "success"
        ).innerText =
            data.success || 0;


        document.getElementById(
            "failed"
        ).innerText =
            data.failed || 0;


        document.getElementById(
            "status"
        ).innerText =
            data.status || "idle";


        document.getElementById(
            "jobId"
        ).innerText =
            data.job_id || "-";


        document.getElementById(
            "senderView"
        ).innerText =
            data.sender_id || "-";


        document.getElementById(
            "recipientView"
        ).innerText =
            data.recipient_uid || "-";


        document.getElementById(
            "fileView"
        ).innerText =
            data.message_file || "-";


        document.getElementById(
            "updated"
        ).innerText =
            data.updated_at || "-";


        document.getElementById(
            "message"
        ).innerText =
            data.message || "-";


        let percentage = 0;

        if (data.total > 0) {

            percentage =
                Math.round(
                    (data.processed /
                    data.total) * 100
                );

        }

        document.getElementById(
            "progress"
        ).style.width =
            percentage + "%";


    } catch (error) {

        document.getElementById(
            "status"
        ).innerText =
            "connection error";

    }
}


loadStatus();

setInterval(
    loadStatus,
    3000
);

</script>

</body>

</html>
