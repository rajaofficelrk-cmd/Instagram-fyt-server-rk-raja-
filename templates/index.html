<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💀 Insta Bulk Sender - 24/7</title>
    <style>
        :root { --bg: #050505; --card: rgba(20, 20, 20, 0.75); --border: rgba(255, 255, 255, 0.1); --text: #e0e0e0; --accent: #ff0033; --neon-blue: #00f3ff; --green: #00cc66; --red: #ff3333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        
        body { 
            background-color: var(--bg);
            background-image: linear-gradient(rgba(5, 5, 5, 0.85), rgba(5, 5, 5, 0.95)), url('https://i.ibb.co/KjtjBDRP/file-00000000f49c821197fdc7fcda40847d.png');
            background-size: cover; background-position: center; background-attachment: fixed; color: var(--text); 
            display: flex; justify-content: center; padding: 20px; min-height: 100vh; 
        }

        .container { background: var(--card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 20px; padding: 30px; width: 100%; max-width: 800px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 243, 255, 0.1); }
        
        .header-area { text-align: center; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center;}
        .header-area img { width: 130px; height: 130px; object-fit: cover; border-radius: 50%; margin-bottom: 15px; border: 3px solid var(--neon-blue); box-shadow: 0 0 25px rgba(0, 243, 255, 0.5); }
        .header-area p { color: #fff; font-weight: bold; font-size: 1.2em; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 0 10px var(--neon-blue); }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        label { display: block; margin-bottom: 8px; color: #bbb; font-size: 0.9em; font-weight: bold; }
        
        textarea, input[type="text"], input[type="number"], select { width: 100%; padding: 14px; background: rgba(0,0,0,0.6); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 14px; transition: 0.3s; }
        textarea:focus, input[type="text"]:focus, input[type="number"]:focus, select:focus { outline: none; border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }
        
        /* File Upload Styling */
        .file-upload-btn { background: #333; color: #fff; border: 1px dashed #555; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 10px; display: inline-block; transition: 0.3s; }
        .file-upload-btn:hover { background: #444; border-color: var(--neon-blue); }

        .btn-group { display: flex; gap: 15px; margin-top: 25px; }
        button { flex: 1; padding: 16px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        #startBtn { background: var(--green); color: #000; box-shadow: 0 0 15px rgba(0, 204, 102, 0.4); }
        #startBtn:hover:not(:disabled) { background: #00ff80; box-shadow: 0 0 25px rgba(0, 204, 102, 0.8); }
        #stopBtn { background: var(--red); color: #fff; box-shadow: 0 0 15px rgba(255, 51, 51, 0.4); }
        #stopBtn:hover:not(:disabled) { background: #ff5555; box-shadow: 0 0 25px rgba(255, 51, 51, 0.8); }
        button:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }
        
        .terminal { margin-top: 25px; background: rgba(0,0,0,0.9); border: 1px solid #333; border-radius: 10px; padding: 15px; height: 250px; overflow-y: auto; font-size: 13px; border-left: 4px solid var(--neon-blue); }
        .log-success { color: var(--green); }
        .log-error { color: var(--red); }
        
        .status-bar { display: flex; justify-content: space-between; margin-top: 20px; padding: 15px 20px; background: rgba(0,0,0,0.8); border-radius: 10px; border: 1px solid var(--border); }
        .status-bar span { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-area">
            <img src="https://i.ibb.co/KjtjBDRP/file-00000000f49c821197fdc7fcda40847d.png" alt="Icon" onerror="this.src='https://via.placeholder.com/130/00f3ff/000000?text=Insta'">
            <p>Insta 24/7 Sender</p>
        </div>

        <form id="senderForm">
            <div class="grid">
                <div class="full-width">
                    <label>🍪 Instagram Cookies (Paste karein ya File Upload karein)</label>
                    <div>
                        <label for="cookie_file" class="file-upload-btn">📁 Upload Cookies File (.txt)</label>
                        <input type="file" id="cookie_file" accept=".txt" onchange="loadCookieFile(event)" style="display: none;">
                    </div>
                    <!-- Har line me ek ID ki cookies -->
                    <textarea id="cookies" name="cookies" rows="6" placeholder="sessionid=...; ds_user_id=...; csrftoken=...&#10;sessionid=...; ds_user_id=...; csrftoken=..." required></textarea>
                </div>

                <!-- ✅ NAYA: EXECUTION MODE -->
                <div class="full-width">
                    <label>⚙️ Execution Mode (Kaise chalana hai?)</label>
                    <select id="run_mode" name="run_mode" required>
                        <option value="parallel">Ek Sath (Parallel) - Saari IDs ek saath messages bhejengi</option>
                        <option value="sequential">Ek Ke Baad Ek (Sequential) - Ek ID poori file bhejegi, fir dusri</option>
                    </select>
                </div>
                
                <div>
                    <label>👥 Thread ID (Group ya Chat)</label>
                    <input type="text" id="thread_id" name="thread_id" placeholder="e.g. 17847376959110469" required>
                </div>

                <div>
                    <label>⏱️ Time Delay (Seconds)</label>
                    <input type="number" id="time_delay" name="time_delay" value="20" min="10" required>
                </div>

                <div class="full-width">
                    <label>🏷️ Here Name (Upar dikhega)</label>
                    <input type="text" id="sender_name" name="sender_name" placeholder="I am here" required>
                </div>

                <div class="full-width">
                    <label>📁 Upload Message File (.txt)</label>
                    <input type="file" id="message_file" name="message_file" accept=".txt" required>
                </div>
            </div>

            <div class="btn-group">
                <button type="button" id="startBtn">▶️ Start 24/7</button>
                <button type="button" id="stopBtn" disabled>⏹️ Stop Server</button>
            </div>
        </form>

        <div class="status-bar">
            <div>Status: <span id="statusText" style="color:var(--accent)">IDLE</span></div>
            <div>Sent: <span id="sentCount" style="color:var(--green)">0</span> | Failed: <span id="failCount" style="color:var(--red)">0</span></div>
        </div>

        <div class="terminal" id="terminal">
            <div>> System ready. Waiting for input...</div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const terminal = document.getElementById('terminal');
        const statusText = document.getElementById('statusText');
        const sentCountEl = document.getElementById('sentCount');
        const failCountEl = document.getElementById('failCount');
        const form = document.getElementById('senderForm');
        let pollingInterval = null;

        function loadCookieFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('cookies').value = e.target.result;
            };
            reader.readAsText(file);
        }

        function printLog(msg, type = 'normal') {
            const div = document.createElement('div');
            if (type === 'error' || msg.includes('❌') || msg.includes('🛑') || msg.includes('Error')) {
                div.className = 'log-error';
            } else if (type === 'success' || msg.includes('✅') || msg.includes('🎉') || msg.includes('🚀')) {
                div.className = 'log-success';
            }
            div.innerText = msg;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                if (!res.ok) return;
                const data = await res.json();
                
                statusText.innerText = data.isRunning ? 'RUNNING' : 'IDLE';
                statusText.style.color = data.isRunning ? 'var(--green)' : 'var(--accent)';
                sentCountEl.innerText = data.totalSent || 0;
                failCountEl.innerText = data.totalFailed || 0;

                if (data.logs && data.logs.length > 0) {
                    terminal.innerHTML = ''; 
                    data.logs.forEach(log => printLog(log));
                }
                startBtn.disabled = data.isRunning;
                stopBtn.disabled = !data.isRunning;
            } catch (err) {}
        }

        startBtn.addEventListener('click', async () => {
            if (!form.checkValidity()) { form.reportValidity(); return; }
            const formData = new FormData(form);
            terminal.innerHTML = '';
            startBtn.disabled = true;
            printLog("> 🚀 Starting server...", 'normal');

            try {
                const res = await fetch('/api/start', { method: 'POST', body: formData });
                
                if (!res.ok) {
                    printLog(`> ❌ Server Error (HTTP ${res.status})`, 'error');
                    startBtn.disabled = false;
                    return;
                }

                const data = await res.json();
                if (data.status === 'error') {
                    printLog(`> ❌ Error: ${data.message}`, 'error');
                    startBtn.disabled = false;
                    return;
                }
                
                printLog(`> ✅ ${data.message}`, 'success');
                if (!pollingInterval) pollingInterval = setInterval(checkStatus, 2000);
                checkStatus();
            } catch (err) {
                printLog(`> ❌ Network Error: ${err.message}`, 'error');
                startBtn.disabled = false;
            }
        });

        stopBtn.addEventListener('click', async () => {
            stopBtn.disabled = true;
            printLog("> Stopping execution...", 'error');
            try { await fetch('/api/stop', { method: 'POST' }); } catch (e) {}
        });

        window.onload = () => {
            checkStatus();
            pollingInterval = setInterval(checkStatus, 3000);
        };
    </script>
</body>
</html>
