<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><♕✫ Rk Rʌȷ͜͡ʌ✫⤹Tʀɪ‌‌c‌‌ƙɜʀ⤸ insta server 🎯/title>
    <style>
        :root { --bg: #0a0a0a; --card: rgba(20, 20, 20, 0.85); --border: #2a2a2a; --text: #e0e0e0; --accent: #ff0033; --green: #00cc66; --red: #ff3333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        
        /* ✅ BACKGROUND MEIN AAPKI PHOTO */
        body { 
            background-color: var(--bg);
            background-image: url('https://i.ibb.co/KjtjBDRP/file-00000000f49c821197fdc7fcda40847d.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-blend-mode: overlay; /* Photo ko dark karne ke liye taaki text dikhe */
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            min-height: 100vh; 
        }

        /* ✅ GLASS EFFECT CONTAINER */
        .container { 
            background: var(--card); 
            backdrop-filter: blur(12px); /* Background photo ko blur karega */
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 25px; 
            width: 100%; 
            max-width: 800px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
        }

        /* ✅ HEADER MEIN AAPKI PHOTO */
        .header-area { text-align: center; margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; }
        .header-area img { 
            width: 120px; 
            height: 120px; 
            object-fit: cover; 
            border-radius: 50%; 
            margin-bottom: 15px; 
            border: 3px solid var(--accent); 
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.6); /* Photo ke peeche red glow */
        }
        .header-area p { color: #fff; font-weight: bold; letter-spacing: 2px; font-size: 1.1em; text-shadow: 0 0 10px rgba(0,0,0,0.8); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        label { display: block; margin-bottom: 5px; color: #ccc; font-size: 0.85em; font-weight: bold; }
        
        textarea, input { 
            width: 100%; 
            padding: 12px; 
            background: rgba(0, 0, 0, 0.7); 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            color: #fff; 
            font-size: 14px; 
            transition: 0.3s;
        }
        textarea:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px rgba(255, 0, 51, 0.3); }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        #startBtn { background: var(--green); color: #000; }
        #startBtn:hover:not(:disabled) { background: #00ff80; box-shadow: 0 0 15px var(--green); }
        #stopBtn { background: var(--red); color: #fff; }
        #stopBtn:hover:not(:disabled) { background: #ff5555; box-shadow: 0 0 15px var(--red); }
        button:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }
        
        .terminal { margin-top: 25px; background: rgba(0, 0, 0, 0.85); border: 1px solid #333; border-radius: 8px; padding: 15px; height: 250px; overflow-y: auto; font-size: 13px; }
        .log-success { color: var(--green); }
        .log-error { color: var(--red); }
        
        .status-bar { display: flex; justify-content: space-between; margin-top: 20px; padding: 15px; background: rgba(0, 0, 0, 0.7); border-radius: 8px; border: 1px solid #333; }
        .status-bar span { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ✅ HEADER PHOTO -->
        <div class="header-area">
            <img src="https://i.ibb.co/KjtjBDRP/file-00000000f49c821197fdc7fcda40847d.png" alt="Icon" onerror="this.src='https://via.placeholder.com/120/ff0033/ffffff?text=Insta'">
            <p>Insta Bulk Sender</p>
        </div>

        <form id="senderForm">
            <div class="grid">
                <div class="full-width">
                    <label>🍪 Instagram Cookies (csrftoken=...; sessionid=...)</label>
                    <textarea id="cookies" name="cookies" rows="3" placeholder="sessionid=...; ds_user_id=...; csrftoken=...;" required></textarea>
                </div>
                
                <div>
                    <label>👥 Thread ID (Group ya Chat ID)</label>
                    <input type="text" id="thread_id" name="thread_id" placeholder="e.g. 3402823668..." required>
                </div>

                <div>
                    <label>⏱️ Time Delay (Seconds)</label>
                    <input type="number" id="time_delay" name="time_delay" value="10" min="5" required>
                </div>

                <div class="full-width">
                    <label>🏷️ Prefix Name (Message ke aage lagega)</label>
                    <input type="text" id="sender_name" name="sender_name" placeholder="I am here" required>
                </div>

                <div class="full-width">
                    <label>📁 Upload Message File (.txt)</label>
                    <input type="file" id="message_file" name="message_file" accept=".txt" required>
                </div>
            </div>

            <div class="btn-group">
                <button type="button" id="startBtn">▶️ Start Process</button>
                <button type="button" id="stopBtn" disabled>⏹️ Stop Process</button>
            </div>
        </form>

        <div class="status-bar">
            <div>Status: <span id="statusText" style="color:var(--accent)">IDLE</span></div>
            <div>Sent: <span id="sentCount" style="color:var(--green)">0</span> | Failed: <span id="failCount" style="color:var(--red)">0</span></div>
        </div>

        <div class="terminal" id="terminal">
            <div>> System ready.</div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const terminal = document.getElementById('terminal');
        const statusText = document.getElementById('statusText');
        const sentCountEl = document.getElementById('sentCount');
        const failCountEl = document.getElementById('failCount');

        let isRunning = false;
        let sentCount = 0;
        let failCount = 0;

        function printLog(msg, type = 'normal') {
            const div = document.createElement('div');
            if (type === 'success' || msg.includes('✅')) div.className = 'log-success';
            if (type === 'error' || msg.includes('❌') || msg.includes('🛑')) div.className = 'log-error';
            div.innerText = msg;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function extractCsrfToken(cookieString) {
            const match = cookieString.match(/csrftoken=([^;]+)/);
            return match ? match[1] : null;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function sendInstagramMessage(threadId, text, cookieStr, csrfToken) {
            // Instagram Direct Text Broadcast Endpoint
            const url = `https://www.instagram.com/api/v1/direct_v2/threads/broadcast/text/`;
            
            const uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });

            const formData = new URLSearchParams();
            formData.append('thread_ids', `[${threadId}]`);
            formData.append('text', text);
            formData.append('client_context', uuid);

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': csrfToken,
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: formData.toString()
            });

            return response.ok;
        }

        startBtn.addEventListener('click', async () => {
            const cookies = document.getElementById('cookies').value.trim();
            const threadId = document.getElementById('thread_id').value.trim();
            const timeDelay = parseInt(document.getElementById('time_delay').value) * 1000;
            const senderName = document.getElementById('sender_name').value.trim();
            const fileInput = document.getElementById('message_file');

            if (!cookies || !threadId || !fileInput.files.length) {
                alert("Please fill all required fields!");
                return;
            }

            const csrfToken = extractCsrfToken(cookies);
            if (!csrfToken) {
                printLog("> ❌ Error: CSRF token not found in cookies! Make sure 'csrftoken=...' exists.", 'error');
                return;
            }

            const file = fileInput.files[0];
            const fileText = await file.text();
            const messages = fileText.split('\n').filter(line => line.trim() !== '');

            if (messages.length === 0) {
                printLog("> ❌ File is empty!", 'error');
                return;
            }

            isRunning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            statusText.innerText = 'RUNNING';
            statusText.style.color = 'var(--green)';
            printLog(`> 🚀 Starting process... Total messages: ${messages.length}`);

            for (let i = 0; i < messages.length; i++) {
                if (!isRunning) {
                    printLog("> 🛑 Process stopped by user.", 'error');
                    break;
                }

                const fullMsg = `${senderName} : ${messages[i].trim()}`;
                printLog(`> Sending [${i+1}/${messages.length}]: "${fullMsg}"`);

                try {
                    const success = await sendInstagramMessage(threadId, fullMsg, cookies, csrfToken);
                    if (success) {
                        sentCount++;
                        sentCountEl.innerText = sentCount;
                        printLog(`> ✅ Sent successfully!`, 'success');
                    } else {
                        failCount++;
                        failCountEl.innerText = failCount;
                        printLog(`> ❌ Failed to send. (Check ID or Cookies)`, 'error');
                    }
                } catch (err) {
                    failCount++;
                    failCountEl.innerText = failCount;
                    printLog(`> ❌ Network/CORS Error: Instagram API access blocked by browser.`, 'error');
                }

                if (i < messages.length - 1 && isRunning) {
                    printLog(`> ⏱️ Waiting ${timeDelay/1000} seconds...`);
                    await sleep(timeDelay);
                }
            }

            isRunning = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusText.innerText = 'IDLE';
            statusText.style.color = 'var(--accent)';
            printLog("> 🎉 Task completed.");
        });

        stopBtn.addEventListener('click', () => {
            isRunning = false;
            stopBtn.disabled = true;
            printLog("> Stopping execution...");
        });
    </script>
</body>
</html>
