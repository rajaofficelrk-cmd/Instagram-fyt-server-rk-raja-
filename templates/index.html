<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💀 Insta Bulk Sender - 24/7</title>
    <style>
        :root { 
            --bg: #050505; --card: rgba(15, 15, 20, 0.85); --border: rgba(255, 255, 255, 0.1); 
            --neon-pink: #ff007f; --neon-blue: #00f3ff; --neon-purple: #9d00ff; --neon-yellow: #ffea00;
            --green: #00ff66; --red: #ff3333; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background-color: var(--bg); background-image: radial-gradient(circle at 50% 0%, #1a0033 0%, #050505 70%); color: #e0e0e0; display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
        .container { background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; padding: 30px; width: 100%; max-width: 800px; box-shadow: 0 0 30px rgba(157, 0, 255, 0.2); position: relative; }
        
        .admin-btn { position: absolute; top: 20px; right: 20px; background: rgba(255, 0, 127, 0.1); color: var(--neon-pink); border: 1px solid var(--neon-pink); padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 12px; font-weight: bold; transition: 0.3s; }
        .admin-btn:hover { background: var(--neon-pink); color: #000; box-shadow: 0 0 15px var(--neon-pink); }

        .header-area { text-align: center; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center;}
        .header-area img { width: 130px; height: 130px; object-fit: cover; border-radius: 50%; margin-bottom: 15px; border: 3px solid var(--neon-pink); box-shadow: 0 0 25px var(--neon-pink); }
        .header-area p { color: #fff; font-weight: bold; font-size: 1.4em; letter-spacing: 4px; text-transform: uppercase; background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }
        
        label.c-pink { color: var(--neon-pink); } label.c-blue { color: var(--neon-blue); }
        label.c-purple { color: var(--neon-purple); } label.c-yellow { color: var(--neon-yellow); }
        label { display: block; margin-bottom: 8px; font-size: 0.95em; font-weight: bold; }
        
        textarea, input[type="text"], input[type="number"], select { width: 100%; padding: 14px; background: rgba(0,0,0,0.7); border: 1px solid #444; border-radius: 8px; color: #fff; }
        .file-upload-btn { background: rgba(157, 0, 255, 0.2); color: var(--neon-purple); border: 1px dashed var(--neon-purple); padding: 10px 15px; border-radius: 6px; cursor: pointer; display: inline-block; margin-bottom: 10px; }
        
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        button { flex: 1; padding: 16px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; }
        #startBtn { background: linear-gradient(45deg, #00cc66, #00ffcc); color: #000; }
        #stopBtn { background: linear-gradient(45deg, #ff0033, #ff007f); color: #fff; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .terminal { margin-top: 25px; background: #000; border: 1px solid #333; border-radius: 10px; padding: 15px; height: 250px; overflow-y: auto; font-size: 13px; border-left: 4px solid var(--neon-blue); }
        .log-success { color: var(--green); } .log-error { color: var(--red); }
        .status-bar { display: flex; justify-content: space-between; margin-top: 20px; padding: 15px; background: #000; border-radius: 10px; border: 1px solid var(--border); }
    </style>
</head>
<body>
    <div class="container">
        <a href="/admin" target="_blank" class="admin-btn">🔐 Admin Panel</a>

        <div class="header-area">
            <img src="https://i.ibb.co/KjtjBDRP/file-00000000f49c821197fdc7fcda40847d.png" alt="Icon">
            <p>Insta 24/7 Sender</p>
        </div>

        <form id="senderForm">
            <div class="grid">
                <div class="full-width">
                    <label class="c-pink">🍪 Instagram Cookies</label>
                    <label for="cookie_file" class="file-upload-btn">📁 Upload Cookies File (.txt)</label>
                    <input type="file" id="cookie_file" accept=".txt" onchange="loadCookieFile(event)" style="display: none;">
                    <textarea id="cookies" name="cookies" rows="4" required></textarea>
                </div>
                <div class="full-width">
                    <label class="c-blue">⚙️ Execution Mode</label>
                    <select id="run_mode" name="run_mode">
                        <option value="parallel">Ek Sath (Parallel)</option>
                        <option value="sequential">Ek Ke Baad Ek (Sequential)</option>
                    </select>
                </div>
                <div><label class="c-purple">👥 Thread ID</label><input type="text" id="thread_id" name="thread_id" required></div>
                <div><label class="c-yellow">⏱️ Delay (Seconds)</label><input type="number" id="time_delay" name="time_delay" value="30" min="10" required></div>
                <div class="full-width"><label class="c-pink">🏷️ Here Name</label><input type="text" id="sender_name" name="sender_name" placeholder="Testing"></div>
                <div class="full-width"><label class="c-blue">📁 Upload Message File (.txt)</label><input type="file" id="message_file" name="message_file" accept=".txt" required style="padding: 10px; border-radius: 8px;"></div>
            </div>
            <div class="btn-group">
                <button type="button" id="startBtn">▶️ Start 24/7</button>
                <button type="button" id="stopBtn" disabled>⏹️ Stop Server</button>
            </div>
        </form>

        <div class="status-bar">
            <div>Status: <span id="statusText" style="color:var(--neon-pink)">IDLE</span></div>
            <div>Sent: <span id="sentCount" style="color:var(--green)">0</span> | Failed: <span id="failCount" style="color:var(--red)">0</span></div>
        </div>
        <div class="terminal" id="terminal"><div>> System ready...</div></div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const terminal = document.getElementById('terminal');
        const statusText = document.getElementById('statusText');
        const form = document.getElementById('senderForm');

        function loadCookieFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { document.getElementById('cookies').value = e.target.result; };
            reader.readAsText(file);
        }

        function printLog(msg) {
            const div = document.createElement('div');
            if (msg.includes('❌') || msg.includes('⚠️') || msg.includes('Block')) div.className = 'log-error';
            else if (msg.includes('✅') || msg.includes('🎉')) div.className = 'log-success';
            else div.className = 'log-info';
            div.innerText = msg;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                statusText.innerText = data.isRunning ? 'RUNNING' : 'IDLE';
                statusText.style.color = data.isRunning ? 'var(--green)' : 'var(--neon-pink)';
                document.getElementById('sentCount').innerText = data.totalSent;
                document.getElementById('failCount').innerText = data.totalFailed;
                if (data.logs && data.logs.length > 0) {
                    terminal.innerHTML = '';
                    data.logs.forEach(log => printLog(log));
                }
                startBtn.disabled = data.isRunning;
                stopBtn.disabled = !data.isRunning;
            } catch (err) {}
        }

        startBtn.addEventListener('click', async () => {
            if (!form.checkValidity()) { form.reportValidity(); return; }
            terminal.innerHTML = '<div>> 🚀 Starting server...</div>';
            startBtn.disabled = true;
            try {
                const formData = new FormData(form);
                const res = await fetch('/api/start', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.status === 'error') { printLog(`❌ ${data.message}`); startBtn.disabled = false; return; }
                printLog(`✅ ${data.message}`);
                checkStatus();
            } catch (err) { startBtn.disabled = false; }
        });

        stopBtn.addEventListener('click', async () => {
            stopBtn.disabled = true;
            try { await fetch('/api/stop', { method: 'POST' }); } catch (e) {}
        });

        window.onload = () => { checkStatus(); setInterval(checkStatus, 3000); };
    </script>
</body>
</html>
