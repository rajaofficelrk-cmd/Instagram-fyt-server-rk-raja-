<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💀 Insta Bulk Sender</title>
    <style>
        :root { --bg: #0a0a0a; --card: #141414; --border: #2a2a2a; --text: #e0e0e0; --accent: #ff0033; --green: #00cc66; --red: #ff3333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
        .container { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; width: 100%; max-width: 800px; }
        .header-area { text-align: center; margin-bottom: 25px; }
        .header-area img { width: 120px; height: 120px; border-radius: 50%; margin-bottom: 15px; border: 3px solid var(--accent); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.85em; }
        textarea, input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 14px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #startBtn { background: var(--green); color: #000; }
        #stopBtn { background: var(--red); color: #fff; }
        button:disabled { opacity: 0.3; }
        .terminal { margin-top: 25px; background: #000; border: 1px solid #333; border-radius: 8px; padding: 15px; height: 250px; overflow-y: auto; font-size: 13px; }
        .log-success { color: var(--green); }
        .log-error { color: var(--red); }
        .status-bar { display: flex; justify-content: space-between; margin-top: 20px; padding: 15px; background: #1a1a1a; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-area">
            <img src="https://i.ibb.co/KjtjBDRP/file-00000000f49c821197fdc7fcda40847d.png" alt="Icon">
            <p>Insta Bulk Sender</p>
        </div>

        <form id="senderForm">
            <div class="grid">
                <div class="full-width">
                    <label>🍪 Instagram Cookies (sessionid=...; ds_user_id=...)</label>
                    <textarea id="cookies" name="cookies" rows="3" placeholder="sessionid=...; ds_user_id=...; csrftoken=...; ig_did=..." required></textarea>
                </div>
                
                <div>
                    <label>👥 Thread ID (Group ya IB)</label>
                    <input type="text" id="thread_id" name="thread_id" placeholder="e.g. 3402823668..." required>
                </div>

                <div>
                    <label>⏱️ Time Delay (Seconds)</label>
                    <input type="number" id="time_delay" name="time_delay" value="10" min="5" required>
                </div>

                <div class="full-width">
                    <label>🏷️ Here Name (Upar dikhega)</label>
                    <input type="text" id="sender_name" name="sender_name" placeholder="I am here" required>
                </div>

                <div class="full-width">
                    <label>📁 Upload Message File (.txt)</label>
                    <input type="file" id="message_file" name="message_file" accept=".txt" required>
                </div>
            </div>

            <div class="btn-group">
                <button type="button" id="startBtn">▶️ Run Server</button>
                <button type="button" id="stopBtn" disabled>⏹️ Stop Server</button>
            </div>
        </form>

        <div class="status-bar">
            <div>Status: <span id="statusText">IDLE</span></div>
            <div>Sent: <span id="sentCount" style="color:var(--green)">0</span> | Failed: <span id="failCount" style="color:var(--red)">0</span></div>
        </div>

        <div class="terminal" id="terminal">
            <div>> System ready.</div>
        </div>
    </div>

    <script>
        const form = document.getElementById('senderForm');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const terminal = document.getElementById('terminal');
        let pollingInterval = null;

        function printLog(msg) {
            const div = document.createElement('div');
            if (msg.includes('✅') || msg.includes('🎉')) div.className = 'log-success';
            if (msg.includes('❌') || msg.includes('🛑')) div.className = 'log-error';
            div.innerText = msg;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function checkStatus() {
            const res = await fetch('/api/status');
            const data = await res.json();
            document.getElementById('statusText').innerText = data.isRunning ? 'RUNNING' : 'IDLE';
            document.getElementById('sentCount').innerText = data.totalSent;
            document.getElementById('failCount').innerText = data.totalFailed;
            startBtn.disabled = data.isRunning;
            stopBtn.disabled = !data.isRunning;
            if (data.logs.length > 0) {
                terminal.innerHTML = '';
                data.logs.forEach(log => printLog(log));
            }
        }

        startBtn.addEventListener('click', async () => {
            if (!form.checkValidity()) { form.reportValidity(); return; }
            const formData = new FormData(form);
            terminal.innerHTML = '';
            startBtn.disabled = true;
            printLog("> Starting server...");

            try {
                const res = await fetch('/api/start', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.status === 'error') {
                    alert(data.message);
                    startBtn.disabled = false;
                    return;
                }
                if (!pollingInterval) pollingInterval = setInterval(checkStatus, 2000);
                checkStatus();
            } catch (err) {
                printLog("> ❌ Network Error.");
                startBtn.disabled = false;
            }
        });

        stopBtn.addEventListener('click', async () => {
            stopBtn.disabled = true;
            printLog("> Sending stop signal...");
            try { await fetch('/api/stop', { method: 'POST' }); } catch (e) {}
        });

        window.onload = () => {
            checkStatus();
            pollingInterval = setInterval(checkStatus, 5000);
        };
    </script>
</body>
</html>
